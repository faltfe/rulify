codecov:
  branch: main
  precision: 2
  round: down
  layout: "reach,diff,flags,tree"
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        target: 75
        threshold: 1
        base: auto
    patch:
      default:
        target: 80
        threshold: 1
        base: auto
    changes:
      default:
        target: 80
        threshold: 1
        base: auto

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github:
  checks:
    annotations: true

pr_comments: true
pr_context: true

fixes:
  - ":::"

ignore:
  - "rulify-example.*"
  - "coverage"
  - ".*\\.generated\\..*"
  - ".*\\.g\\..*"
  - ".*Lombok.*"
  - ".*Config.*"
