version: 2
updates:
    # Maven dependencies
    - package-ecosystem: "maven"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "03:00"
      open-pull-requests-limit: 10
      commit-message:
          prefix: "chore(deps):"
          prefix-development: "chore(deps-dev):"
          include: "scope"
      allow:
          - dependency-type: "all"

    # GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "04:00"
      open-pull-requests-limit: 10
      commit-message:
          prefix: "ci(actions):"
          include: "scope"
